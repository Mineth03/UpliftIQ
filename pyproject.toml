[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaiq"
version = "0.1.0"
description = "Uncertainty-aware causal-prescriptive BI for constrained retail promotion decisions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "CausaIQ research project" }]
dependencies = [
  "numpy>=1.24,<2.1",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<1.6",
  "scipy>=1.11,<1.15",
  "pyarrow>=14.0",
  "econml>=0.15.0",
  "ortools>=9.8",
  "streamlit>=1.28",
  "plotly>=5.18",
  "joblib>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
